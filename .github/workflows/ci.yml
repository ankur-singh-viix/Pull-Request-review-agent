name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: mypy app
      - run: pytest -q

  eval-gate:
    needs: test
    runs-on: ubuntu-latest
    env:
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      # Offline baseline: deterministic and free; blocks regressions in graph logic
      - name: Eval (offline baseline, easy tier)
        env:
          USE_FAKE_LLM: "1"
        run: python -m evals.run_eval --tier easy --min-recall 0.8 --min-precision 0.8
      # Real model on every case, main branch only, when the secret exists
      - name: Eval (live LLM, all cases)
        if: github.ref == 'refs/heads/main' && env.ANTHROPIC_API_KEY != ''
        run: >
          python -m evals.run_eval --tier all --min-recall 0.7 --min-precision 0.7
          --save evals/results/live.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evals/results/
          if-no-files-found: ignore
  docker:
    needs: eval-gate
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}

  deploy:
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production   # add required reviewers in repo settings for a manual gate
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}
      - uses: google-github-actions/deploy-cloudrun@v2
        with:
          service: pr-review-agent
          region: asia-south1
          source: .
          secrets: |
            ANTHROPIC_API_KEY=ANTHROPIC_API_KEY:latest
            GITHUB_TOKEN=GITHUB_TOKEN:latest
            GITHUB_WEBHOOK_SECRET=GITHUB_WEBHOOK_SECRET:latest
          env_vars: DRY_RUN=0
